<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowbar</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0d10; color: #f2f4f8;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 34px; margin: 18px 0 8px; }
  p { color: #9aa3b2; }
  a { color: #ffb020; }
  .dots { display: flex; gap: 10px; justify-content: center; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: #232833; }
  .dots span:nth-child(3), .dots span:nth-child(4), .dots span:nth-child(5) {
    background: #ffb020; box-shadow: 0 0 20px #ffb02066;
  }
</style>
</head>
<body>
<main>
  <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
  <h1>Glowbar</h1>
  <p>LED banner for Android.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
